backend:
  name: git-gateway
  branch: main

media_folder: "images"
public_folder: "/images"

collections:
  - name: "pages"
    label: "Halaman Website"
    files:
      - file: "index.html"
        label: "Beranda (Home)"
        name: "home"
        fields:
          - { label: "Judul Utama", name: "title", widget: "string" }
          - { label: "Deskripsi", name: "description", widget: "text" }
      
